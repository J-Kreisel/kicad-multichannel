name: Release KiCad plugin
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --junitxml=test-results.xml
      - name: Report test diagnostics
        if: failure()
        run: python -c "from pathlib import Path; p=Path('test-results.xml'); print('::error::' + (p.read_text() if p.exists() else 'No test report produced').replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - run: python tools/build_kicad_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: kicad-pcm
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
      - run: python tools/build_pcm_repository.py --output pcm-repository
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: peaceiris/actions-gh-pages@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pcm
          publish_dir: pcm-repository
